services:
  prism-tube:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-7000}:7000"
    environment:
      HOST: 0.0.0.0
      PORT: 7000
      ENABLED_SOURCES: ${ENABLED_SOURCES:-xvideos,homo,xhamster,xnxx}
      ADDON_TOKEN: ${ADDON_TOKEN:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-12000}
      EXTRACT_TIMEOUT_MS: ${EXTRACT_TIMEOUT_MS:-25000}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      MAX_CACHE_ENTRIES: ${MAX_CACHE_ENTRIES:-500}
      MAX_RESULTS: ${MAX_RESULTS:-60}
      MAX_STREAMS: ${MAX_STREAMS:-4}
      SEARCH_CONCURRENCY: ${SEARCH_CONCURRENCY:-2}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

